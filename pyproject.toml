[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-xai-audit"
version = "0.1.0"
description = "Reproducible audit of data quality and explanation stability on a public classification benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
dq-xai = "dq_xai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
